[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-agent-workflow"
version = "0.1.0"
description = "LangGraph + ComfyUI MVP for local video generation agent workflows"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "langgraph>=0.2.60",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "tenacity>=8.2.3",
  "typer>=0.12.3",
  "websocket-client>=1.8.0"
]

[project.scripts]
video-agent-mvp = "video_agent_workflow.run:app"

[project.optional-dependencies]
local-llm = [
  "accelerate>=0.33.0",
  "transformers>=4.51.0"
]

[tool.setuptools.packages.find]
where = ["src"]
